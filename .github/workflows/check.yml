name: Check

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  swift:
    name: Swift tests and app build
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show Swift version
        run: swift --version

      - name: Run local check
        run: make check
